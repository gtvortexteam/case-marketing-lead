<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тестовое Marketing Lead · Леонид Милихедин</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/case-marketing-lead/assets/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --bg: #F7F5F0; --ink: #16181D; --muted: #5E6573; --rule-strong: #16181D;
      --accent: #2340C8; --accent-ink: #1A2F99; --focus: #2340C8;
      --font-text: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-display: Georgia, "Times New Roman", serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #121316; --ink: #ECEAE4; --muted: #9CA1AA; --rule-strong: #ECEAE4;
        --accent: #93A5FF; --accent-ink: #B5C2FF; --focus: #93A5FF;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #121316; --ink: #ECEAE4; --muted: #9CA1AA; --rule-strong: #ECEAE4;
      --accent: #93A5FF; --accent-ink: #B5C2FF; --focus: #93A5FF;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      padding: 16px; background: var(--bg); color: var(--ink);
      font: 400 1rem/1.6 var(--font-text);
    }
    main { width: 100%; max-width: 30rem; border-top: 2px solid var(--rule-strong); padding-top: 24px; }
    p { margin: 0; }
    .title { font: 600 clamp(1.75rem, 1.4rem + 1.4vw, 2.5rem)/1.15 var(--font-display); }
    .back { margin-top: 24px; }
    a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: var(--accent-ink); text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="title">Такой страницы нет.</p>
    <p class="back"><a href="/case-marketing-lead/">Открыть ответ</a></p>
  </main>
</body>
</html>
